services:
  - type: web
    name: edumind-ai
    env: python
    buildCommand: pip install -r requirements.txt
    releaseCommand: python recalculate_risk_scores.py --no-rebalance --no-backfill
    # Match Procfile: allow slow OpenRouter responses (default gunicorn timeout is 30s)
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
